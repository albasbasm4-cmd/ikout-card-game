name: Multiplayer Fix CI

on:
  push:
    branches:
      - fix/multiplayer-stability-2026-11
  pull_request:
    branches:
      - main

concurrency:
  group: multiplayer-fix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Prepare Android project
        run: |
          node scripts/generate-static-html.mjs
          npx cap add android || true
          node scripts/patch-capacitor-android.mjs
          npx cap sync android
          node scripts/patch-capacitor-android.mjs
          node scripts/verify-assets.mjs

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK assets
        run: node scripts/verify-apk.mjs

      - name: Upload branch APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ikout-multiplayer-fix-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
