name: Build Android APK

on:
  push:
    branches: [main, fix/android-apk-asset-packaging]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Tests & Build Web Assets
        run: |
          npm test
          npm run build
          node scripts/generate-static-html.mjs
          node scripts/verify-assets.mjs

      - name: Setup Android Project & Sync
        run: |
          npx cap add android || true
          npx cap sync android
          node scripts/verify-assets.mjs

      - name: Build Android APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Asset Integrity
        run: node scripts/verify-apk.mjs

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ikout-card-game-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
