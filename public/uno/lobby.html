      html,

      /* المسرح 2400×1080 */
      #st {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2400px;
        height: 1080px;
        transform-origin: center;
        overflow: hidden;
        background: linear-gradient(#6a92b4 0, #86aac3 14%, #adc4d2 26%, #c5d3da 30.3%);

      .glow {
        position: absolute;

          rgba(255, 255, 255, 0) 68%

      }
      .cl {
        position: absolute;
        aspect-ratio: 3;
        opacity: 0.92;
        animation: drift 22s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from {
          transform: translateX(-26px);
        }
        to {
          transform: translateX(26px);
        }
      }
      .haze {
        position: absolute;

        top: 283px;

        height: 194px;

      }
      #sk {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;

      /* الملف الشخصي */
      #prof {

        transform: scale(1.5625);

                  <button class="kchip" onclick="setCap(1)">+</button>
                </div>
              </div>
              <button class="kb kbl" id="kqrb" onclick="openQR()"><span>رمز QR</span></button>
              <button class="kb kr2" id="kgo" onclick="startRoom()" style="display: none">
                <span>ابدأ اللعبة</span>
              </button>
              <div class="kst kdk" id="kwt">
                <div>
                  <span id="kwtx"></span><br /><span class="dots"><i></i><i></i><i></i></span>
                </div>
              </div>
            </div>
            <div id="ksa"></div>
          </div>
        </div>
      </div>
      <!-- /kr -->

      <!-- مودال QR -->
      <div id="md">
        <div id="mdin"><div class="kmc" id="mc"></div></div>
      </div>
    </div>
    <!-- /rscr -->

    <script>
      const $ = (id) => document.getElementById(id);

      /* ===== الملف الشخصي ===== */
      const R = { base: 30, bonus: 5, maxStreak: 5 },
        need = (l) => 100 + (l - 1) * 25;
      let S = { lvl: 5, xp: 50, streak: 0, flag: "🇰🇼", name: "usbysg." };
      try {
        Object.assign(S, JSON.parse(localStorage.getItem("uno1") || "{}"));
      } catch (e) {}
      try {
        const pr = JSON.parse(localStorage.getItem("ikout_profile_v1") || "{}");
        if (pr.name) S.name = pr.name;
      } catch (e) {}
      const save = () => {
        try {
          localStorage.setItem("uno1", JSON.stringify(S));
        } catch (e) {}
      };

      const FL =
        "🇰🇼 الكويت,🇸🇦 السعودية,🇦🇪 الإمارات,🇶🇦 قطر,🇧🇭 البحرين,🇴🇲 عُمان,🇾🇪 اليمن,🇮🇶 العراق,🇸🇾 سوريا,🇯🇴 الأردن,🇵🇸 فلسطين,🇪🇬 مصر,🇱🇾 ليبيا,🇹🇳 تونس,🇩🇿 الجزائر,🇲🇦 المغرب,🇲🇷 موريتانيا,🇸🇩 السودان,🇸🇴 الصومال,🇩🇯 جيبوتي,🇰🇲 القمر,🇹🇷 تركيا,🇮🇷 إيران,🇵🇰 باكستان,🇦🇫 أفغانستان,🇧🇩 بنغلاديش,🇮🇩 إندونيسيا,🇲🇾 ماليزيا,🇧🇳 بروناي,🇲🇻 المالديف,🇦🇿 أذربيجان,🇺🇿 أوزبكستان,🇰🇿 كازاخستان,🇦🇱 ألبانيا,🇳🇪 النيجر,🇲🇱 مالي,🇸🇳 السنغال";
      $("gr").innerHTML = FL.split(",")
        .map((t) => {
          const [f, n] = t.split(" ");
          return `<button class="f" data-f="${f}"><span>${f}</span>${n}</button>`;
        })
        .join("");
      $("gr").onclick = (e) => {
        const b = e.target.closest(".f");
        if (!b) return;
        S.flag = b.dataset.f;
        renderProfile();
        save();
      };

      function renderProfile() {
        const p = Math.min(100, (S.xp / need(S.lvl)) * 100);
        $("xpf").style.width = $("pf").style.width = p + "%";
        if ($("kxpf")) $("kxpf").style.width = p + "%";
        $("lvn").textContent = $("pl2").textContent = S.lvl;
        if ($("klvn")) $("klvn").textContent = S.lvl;
        $("pt").textContent = S.xp + " / " + need(S.lvl) + " XP";
        $("fl").textContent = S.flag;
        $("un").textContent = S.name;
        if ($("kfl")) {
          $("kfl").textContent = S.flag;
          $("kun").textContent = S.name;
        }
        document
          .querySelectorAll(".f")
          .forEach((b) => b.classList.toggle("on", b.dataset.f === S.flag));
      }
      function pop(txt) {
        const d = document.createElement("div");
        d.className = "pop";
        d.textContent = txt;
        ($("ov").classList.contains("on") ? $("pm") : $("prof")).appendChild(d);
        setTimeout(() => d.remove(), 1300);
      }
      function addWin() {
        const g = R.base + Math.min(S.streak, R.maxStreak) * R.bonus;
        S.streak++;
        S.xp += g;
        let up = false;
        while (S.xp >= need(S.lvl)) {
          S.xp -= need(S.lvl);
          S.lvl++;
          up = true;
        }
        renderProfile();
        save();
        pop(up ? "ترقية! المستوى " + S.lvl + " 🎉" : "+" + g + " XP");
        if (up) {
          const s = $("lvs");
          s.classList.remove("bump");
          void s.offsetWidth;
          s.classList.add("bump");
        }
      }
      function resetStreak() {
        S.streak = 0;
        save();
      }
      function openP() {
        $("nm").value = S.name;
        $("ov").classList.add("on");
      }
      function closeP() {
        $("ov").classList.remove("on");
      }
      $("ov").onclick = (e) => {
        if (e.target === $("ov")) closeP();
      };
      $("nm").oninput = (e) => {
        S.name = e.target.value.trim() || "usbysg.";
        renderProfile();
        save();
      };
      renderProfile();

      /* ===== إعدادات التدريب: اللاعبون 2→10، مستوى البوت ===== */
      const PL_MIN = 2,
        PL_MAX = 10;
      const LV = ["سهل", "متوسط", "صعب"],
        LVK = ["easy", "medium", "hard"];
      let C = { p: 4, l: 1 }; // p = عدد اللاعبين (2-10)، l = index مستوى البوت
      try {
        const saved = JSON.parse(localStorage.getItem("uno_cfg") || "null");
        if (saved && typeof saved.p === "number" && saved.p >= PL_MIN && saved.p <= PL_MAX)
          C.p = saved.p;
        if (saved && typeof saved.l === "number" && saved.l >= 0 && saved.l < LV.length)
          C.l = saved.l;
      } catch (e) {}
      const saveC = () => {
        try {
          localStorage.setItem("uno_cfg", JSON.stringify(C));
        } catch (e) {}
      };

      function renderC() {
        $("vp").textContent = C.p;
        $("vl").textContent = LV[C.l];
        // تحديث لوحة الملخص
        $("sumP").textContent = C.p;
        $("sumL").textContent = LV[C.l];
      }
      function step(k, d) {
        if (k === "p") {
          C.p = Math.max(PL_MIN, Math.min(PL_MAX, C.p + d));
        } else if (k === "l") {
          C.l = (C.l + d + LV.length) % LV.length;
        }
        renderC();
        saveC();
      }

      let tt;
      function toast(m) {
        const t = $("toast");
        t.textContent = m;
        t.classList.add("on");
        clearTimeout(tt);
        tt = setTimeout(() => t.classList.remove("on"), 2200);
      }

      /* إطلاق حدث مباراة جديدة */
      function newGame() {
        const cfg = { players: C.p, botLevel: LVK[C.l] };
        toast("مباراة جديدة: " + cfg.players + " لاعبين • " + LV[C.l]);
        window.dispatchEvent(new CustomEvent("startgame", { detail: cfg }));
      }
      function goBackLobby() {
        window.dispatchEvent(new CustomEvent("goback"));
      }

      renderC();

      /* ===== أفق المدينة (للوبي) ===== */
      const B = [
        [0, 60, 482],
        [60, 60, 512],
        [120, 70, 532],
        [190, 60, 500],
        [250, 50, 542],
        [300, 60, 490],
        [360, 60, 532],
        [420, 50, 512],
        [470, 40, 562],
        [505, 55, 440],
        [560, 45, 522],
        [600, 50, 578],
        [650, 50, 546],
        [700, 45, 582],
        [800, 50, 572],
        [850, 50, 536],
        [900, 60, 592],
        [960, 60, 546],
        [1020, 50, 510],
        [1070, 40, 552],
        [1110, 38, 468],
        [1148, 52, 522],
        [1200, 60, 562],
        [1260, 60, 536],
        [1320, 50, 502],
        [1370, 50, 546],
        [1420, 50, 486],
        [1470, 66, 530],
      ];
      let kk = '<g fill="#3b4247">';
      B.forEach(
        ([x, w, t]) => (kk += `<rect x="${x + w / 2}" y="${t - 38}" width="${w}" height="500"/>`),
      );
      kk +=
        '</g><g fill="#4b5359"><rect x="764" y="500" width="10" height="200"/><ellipse cx="769" cy="494" rx="16" ry="30"/><rect x="767" y="430" width="4" height="64"/></g><g fill="#232628">';
      B.forEach(([x, w, t]) => {
        kk += `<rect x="${x}" y="${t}" width="${w + 1}" height="${700 - t}"/>`;
        if (t < 500) kk += `<rect x="${x + w / 2 - 1}" y="${t - 26}" width="3" height="27"/>`;
      });
      $("sk").innerHTML = kk + "</g>";

      /* ===== ملاءمة الشاشة ===== */
      function fitLobby() {
        const w = innerWidth,
          h = innerHeight,
          p = h > w;
        const s = p ? Math.min(h / 2400, w / 1080) : Math.min(w / 2400, h / 1080);
        $("st").style.transform = `translate(-50%,-50%)${p ? " rotate(90deg)" : ""} scale(${s})`;
      }
      function fitRoom() {
        const w = innerWidth,
          h = innerHeight,
          p = h > w;
        const s = p ? Math.min(h / 1536, w / 691) : Math.min(w / 1536, h / 691);
        $("rscr").style.transform = `translate(-50%,-50%)${p ? " rotate(90deg)" : ""} scale(${s})`;
        $("rscr").style.left = "50%";
        $("rscr").style.top = "50%";
      }
      addEventListener("resize", () => {
        fitLobby();
        fitRoom();
      });
      fitLobby();
      fitRoom();

      /* ===== الغرفة (Hotspot — نفس آلية الجوكر لكن MAX=10) =====
   window.UnoNative (اختياري):
     UnoNative.host(code)   — يبدأ استقبال الاتصالات
     UnoNative.join(code)   — يتصل بالمضيف
     UnoNative.scan()       — يفتح الكاميرا ثم يستدعي window.onScan(text)
     UnoNative.send(json)   — json = {"to":"host"|"<id>","m":{...}}
     UnoNative.stop()       — يغلق الغرفة
   من التطبيق: window.onNativeMessage({from,m})  |  window.onScan(text)  */

      const MIN_ROOM = 2,
        MAX_ROOM = 10;
      const nat = () => window.UnoNative;
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const rand = () => {
        const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let r = "";
        for (let i = 0; i < 5; i++) r += a[(Math.random() * a.length) | 0];
        return r;
      };

      let isHost = false,
        ME = null,
        G = null,
        L = null,
        code = "",
        simN = 0;
      const sim = {};

      /* --- النقل --- */
      function sendP(id, m) {
        if (isHost && id === "h") return void setTimeout(() => cRecv(m), 0);
        if (sim[id]) return void setTimeout(() => sim[id] && sim[id](m), 0);
        const n = nat();
        if (n && n.send) n.send(JSON.stringify({ to: id, m }));
      }
      function toHost(m) {
        if (isHost) return void setTimeout(() => hRecv("h", m), 0);
        const n = nat();
        if (n && n.send) n.send(JSON.stringify({ to: "host", m }));
      }
      window.onNativeMessage = (s) => {
        const o = typeof s === "string" ? JSON.parse(s) : s;
        if (isHost) hRecv(o.from, o.m);
        else cRecv(o.m);
      };
      window.onScan = (t) => {
        const m = String(t).match(/join=?([A-Za-z0-9]+)/);
        enterRoom((m ? m[1] : String(t)).trim().slice(0, 6));
      };

      /* --- منطق المضيف --- */
      function lobbyPush() {
        if (!G) return;
        if (G.ph === "lobby") {
          if (G.P.length >= MIN_ROOM) {
            if (!G.P.some((p) => p.id === G.starter))
              G.starter = G.P[(Math.random() * G.P.length) | 0].id;
          } else G.starter = null;
        }
        const L2 = {
          code: G.code,
          cap: G.cap,
          starter: G.starter,
          players: G.P.map((p) => ({ id: p.id, name: p.name })),
        };
        G.P.forEach((p) => sendP(p.id, { t: "lobby", L: L2, you: p.id }));
      }
      function hRecv(id, m) {
        if (!G) return;
        if (m.t === "join") {
          if (G.P.some((p) => p.id === id)) return;
          if (G.ph !== "lobby") return sendP(id, { t: "rej", why: "اللعبة بدأت بالفعل" });
          if (G.P.length >= G.cap) return sendP(id, { t: "rej", why: "الغرفة ممتلئة" });
          G.P.push({ id, name: String(m.name || "لاعب").slice(0, 14) });
          return lobbyPush();
        }
        if (!G.P.some((p) => p.id === id)) return;
        if (m.t === "leave") goneP(id);
        else if (m.t === "deal") {
          if (G.ph === "lobby" && id === G.starter && G.P.length >= MIN_ROOM) {
            G.ph = "play";
            G.P.forEach((p) =>
              sendP(p.id, { t: "start", players: G.P.map((q) => ({ id: q.id, name: q.name })) }),
            );
          }
        }
      }
      function goneP(id) {
        if (!G) return;
        const p = G.P.find((x) => x.id === id);
        if (!p) return;
        G.P = G.P.filter((x) => x !== p);
        delete sim[id];
        lobbyPush();
      }
      function setCap(d) {
        if (!G || G.ph !== "lobby") return;
        const lo = Math.max(MIN_ROOM, G.P.length),
          n = G.cap + d;
        if (n > MAX_ROOM) return toast("الحد الأقصى " + MAX_ROOM + " مقاعد");
        if (n < lo) return toast("لا يمكن أقل من " + lo + " مقاعد");
        G.cap = n;
        lobbyPush();
      }
      function kick(id) {
        if (!G || G.ph !== "lobby" || id === "h") return;
        sendP(id, { t: "bye" });
        goneP(id);
      }
      function addSim() {
        if (!G || G.ph !== "lobby") return;
        if (G.P.length >= G.cap) return toast("لا توجد مقاعد فارغة");
        const id = "s" + ++simN;
        sim[id] = (m) => {
          if (m.t === "start") delete sim[id];
        };
        hRecv(id, { t: "join", name: "لاعب " + simN });
      }

      /* --- منطق اللاعب --- */
      function cRecv(m) {
        if (m.t === "lobby") {
          ME = m.you;
          L = m.L;
          showRoomView(true);
        } else if (m.t === "rej") {
          toast(m.why);
          L = null;
          showRoomView(false);
        } else if (m.t === "start") {
          toast("بدأت اللعبة!");
          window.dispatchEvent(
            new CustomEvent("unostart", {
              detail: { players: m.players, code: G ? G.code : code },
            }),
          );
        } else if (m.t === "bye") {
          toast(isHost ? "" : "تم إخراجك من الغرفة");
          leaveRoom();
        }
      }

      /* --- واجهة الغرفة --- */
      function showLobby() {
        $("st").style.display = "block";
        $("rscr").style.display = "none";
        fitLobby();
      }
      function showRoomScreen() {
        $("st").style.display = "none";
        $("rscr").style.display = "block";
        fitRoom();
      }

      function createRoom() {
        isHost = true;
        ME = "h";
        code = rand();
        L = null;
        simN = 0;
        G = { code, cap: 4, P: [{ id: "h", name: S.name }], ph: "lobby", starter: null };
        $("kr").className = "host";
        $("ttl").textContent = "إنشاء غرفة";
        $("ksa").innerHTML = "";
        showRoomScreen();
        if (nat() && nat().host) nat().host(code);
        lobbyPush();
        window.dispatchEvent(new CustomEvent("createroom", { detail: { code } }));
      }
      function joinRoom() {
        isHost = false;
        ME = null;
        L = null;
        G = null;
        $("kr").className = "join";
        $("ttl").textContent = "الانضمام إلى غرفة";
        $("ci").value = "";
        showRoomView(false);
        showRoomScreen();
        window.dispatchEvent(new CustomEvent("joinroom"));
      }
      function enterRoom(c) {
        if (!nat()) {
          toast("الانضمام يعمل عبر الـ Hotspot داخل التطبيق");
          return;
        }
        code = c.toUpperCase();
        if (nat().join) nat().join(code);
        toHost({ t: "join", name: S.name });
        window.dispatchEvent(new CustomEvent("joinroom-request", { detail: { code } }));
      }
      function joinCode() {
        const v = $("ci").value.trim();
        if (v.length < 4) {
          toast("أدخل رمز الغرفة");
          return;
        }
        enterRoom(v);
      }
      function showRoomView(inRoom) {
        $("kjv").style.display = inRoom ? "none" : "";
        $("krv").style.display = inRoom ? "" : "none";
        if (inRoom) renderRoom();
      }
      function leaveRoom() {
        if (isHost && G) {
          G.P.forEach((p) => p.id !== "h" && sendP(p.id, { t: "bye" }));
          G = null;
          if (nat() && nat().stop) nat().stop();
        } else if (!isHost && L) toHost({ t: "leave" });
        L = null;
        window.dispatchEvent(new CustomEvent("leaveroom", { detail: { code } }));
        showLobby();
      }

      function seatInner(p, i) {
        const num = `<span class="knum">${i + 1}</span>`;
        if (!p) return num + '<div class="kav">+</div><div class="ksn">مقعد فارغ</div>';
        return (
          num +
          `<div class="kav">🧔</div><div class="ksn" dir="auto">${esc(p.name)}</div>` +
          `<div class="kbg">${p.id === "h" ? '<b class="ho">المضيف</b>' : ""}${p.id === ME && p.id !== "h" ? '<b class="hu">أنت</b>' : ""}</div>` +
          (isHost && p.id !== ME
            ? `<button class="kx" data-a="rm" data-id="${p.id}" aria-label="إزالة">✕</button>`
            : "")
        );
      }
      function renderRoom() {
        if (!L) return;
        const N = L.cap,
          n = L.players.length,
          box = $("ksa");
        const c = N <= 4 ? 2 : N <= 6 ? 3 : N <= 8 ? 4 : 5,
          r = Math.ceil(N / c);
        box.style.setProperty("--c", c);
        box.style.setProperty("--r", r);
        box.className = r >= 3 ? "dn" : "";
        if (box.children.length !== N) {
          box.innerHTML = "";
          for (let i = 0; i < N; i++) {
            const d = document.createElement("div");
            d.className = "ks";
            d.dataset.i = i;
            d.style.animationDelay = i * 30 + "ms";
            box.appendChild(d);
          }
        }
        [...box.children].forEach((el, i) => {
          const p = L.players[i],
            sig = JSON.stringify([p, isHost, ME]);
          if (el.dataset.c !== sig) {
            el.innerHTML = seatInner(p, i);
            el.dataset.c = sig;
          }
          el.classList.toggle("empty", !p);
          el.classList.toggle("me", !!p && p.id === ME);
        });
        $("kocn").textContent = n;
        $("kot").textContent = N;
        $("code").textContent = L.code;
        code = L.code;
        const go = n >= MIN_ROOM && L.starter === ME;
        $("kgo").style.display = go ? "" : "none";
        $("kwt").style.display = go ? "none" : "";
        $("kwtx").textContent =
          n < MIN_ROOM
            ? "بانتظار اكتمال " + MIN_ROOM + " لاعبين على الأقل"
            : "بانتظار اللاعب المُختار ليبدأ اللعبة";
        $("kdemo").style.display = isHost && !nat() ? "block" : "none";
        $("kstp_host").style.display = isHost ? "flex" : "none";
      }
      $("ksa").onclick = (e) => {
        const b = e.target.closest('[data-a="rm"]');
        if (b) kick(b.dataset.id);
      };
      function copyCode() {
        try {
          navigator.clipboard.writeText(code).then(
            () => toast("تم نسخ الرمز"),
            () => toast("الرمز: " + code),
          );
        } catch (e) {
          toast("الرمز: " + code);
        }
      }
      function startRoom() {
        toHost({ t: "deal" });
      }

      /* --- QR / Camera --- */
      let stream = null,
        scanning = false;
      function openModal(h) {
        $("mc").innerHTML = h;
        $("md").classList.add("on");
      }
      function closeModal() {
        scanning = false;
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
        $("md").classList.remove("on");
      }
      $("md").onclick = (e) => {
        if (e.target === $("md") || e.target === $("mdin")) closeModal();
      };
      function openQR() {
        const url =
          ((nat() && nat().hostInfo && nat().hostInfo()) || location.href.split("#")[0]) +
          "#join" +
          code;
        openModal(
          `<h2>رمز QR للغرفة</h2><div class="qbox" id="qr"></div><p>اطلب من اللاعبين مسح الرمز<br><span dir="ltr">${code}</span></p><button class="kb kbl" onclick="closeModal()"><span>إغلاق</span></button>`,
        );
        if (typeof QRCode !== "undefined")
          new QRCode($("qr"), {
            text: url,
            width: 260,
            height: 260,
            correctLevel: QRCode.CorrectLevel.M,
          });
        else $("qr").textContent = code;
      }
      async function openScan() {
        if (nat() && nat().scan) {
          nat().scan();
          return;
        }
        if (!navigator.mediaDevices || !("BarcodeDetector" in window)) {
          toast("المسح غير مدعوم، أدخل الرمز يدوياً");
          return;
        }
        openModal(
          `<h2>مسح رمز QR</h2><video id="vd" playsinline muted></video><p>وجّه الكاميرا نحو الرمز</p><button class="kb kr2" onclick="closeModal()"><span>إلغاء</span></button>`,
        );
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
          });
          const v = $("vd");
          v.srcObject = stream;
          await v.play();
          const det = new BarcodeDetector({ formats: ["qr_code"] });
          scanning = true;
          const loop = async () => {
            if (!scanning) return;
            try {
              const r = await det.detect(v);
              if (r.length) {
                const m = r[0].rawValue.match(/join=?([A-Za-z0-9]+)/);
                const c = (m ? m[1] : r[0].rawValue).trim().slice(0, 6);
                closeModal();
                enterRoom(c);
                return;
              }
            } catch (e) {}
            setTimeout(loop, 250);
          };
          loop();
        } catch (e) {
          closeModal();
          toast("تعذّر تشغيل الكاميرا، أدخل الرمز يدوياً");
        }
      }

      /* route عبر hash */
      function route() {
        const m = location.hash.match(/^#join=?([A-Za-z0-9]*)/);
        if (!m) return;
        joinRoom();
        if (m[1]) enterRoom(m[1]);
      }
      addEventListener("hashchange", route);
      route();

      /* أفق المدينة للغرفة */
      let kkRoom = '<g fill="#3b4247">';
      B.forEach(
        ([x, w, t]) =>
          (kkRoom += `<rect x="${x + w / 2}" y="${t - 38}" width="${w}" height="400"/>`),
      );
      kkRoom +=
        '</g><g fill="#4b5359"><rect x="764" y="500" width="10" height="140"/><ellipse cx="769" cy="494" rx="16" ry="30"/><rect x="767" y="430" width="4" height="64"/></g><g fill="#25292c">';
      B.forEach(([x, w, t]) => {
        kkRoom += `<rect x="${x}" y="${t}" width="${w + 1}" height="${640 - t}"/>`;
        if (t < 500) kkRoom += `<rect x="${x + w / 2 - 1}" y="${t - 26}" width="3" height="27"/>`;
      });
      $("ksk").innerHTML = kkRoom + "</g>";
    </script>
    <script>
      /* iKout bridge: forward lobby actions to the host app (this page runs inside an iframe at /uno). */
      (function () {
        var post = function (m) {
          try {
            (window.parent !== window ? window.parent : window).postMessage(m, location.origin);
          } catch (e) {}
        };
        window.addEventListener("startgame", function (e) {
          post({ type: "uno:start", players: e.detail.players, botLevel: e.detail.botLevel });
        });
        window.addEventListener("goback", function () {
          post({ type: "uno:home" });
        });
        window.addEventListener("createroom", function () {
          post({ type: "uno:room" });
        });
        window.addEventListener("joinroom", function () {
          post({ type: "uno:join" });
        });
      })();
    </script>
  </body>
</html>
